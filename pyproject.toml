# The development environment for working on xreview itself: `uv sync`, then
# `uv run pytest`. The plugin needs none of it at run time: the runner uses
# only the standard library, and bin/xreview finds Python 3.10 or later.

[project]
name = "xreview"
# uv requires a version, but Claude Code never reads this file. The plugin
# has none (see plugin.json), so installs follow commits.
version = "0.0.0"
description = "Cross-model code review between Claude Code and Codex."
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.12.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 79

[tool.ruff.lint]
select = ["E", "W", "F"]
