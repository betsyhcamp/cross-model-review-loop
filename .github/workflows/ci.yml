name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Hygiene, lint, format and plugin validation don't depend on the OS, so
  # they run once.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.33"

      # A Python that uv downloads gets a minor-version link (cpython-3.12).
      # pre-commit-uv builds hook environments through it that record 3.12,
      # and pre-commit's health check then rejects them against the real
      # 3.12.9. Requesting the exact version avoids the link.
      - name: Use the Python in .python-version
        run: echo "UV_PYTHON=$(cat .python-version)" >> "$GITHUB_ENV"

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: uv sync --locked

      - name: Cache pre-commit hooks
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit
        run: task pre-commit

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Pinned to the version used in development; validation needs no login.
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.296

      - name: Validate the plugin
        run: task validate

  # The runner manages Codex's process group and signals, which differ
  # between macOS and Linux, so the tests run on both.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.33"

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests on Python 3.12
        run: task test

      - name: Run tests on Python 3.10
        run: task test-min
